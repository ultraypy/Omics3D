name: Validate and publish Omics3D

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: omics3d-pypi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Check package readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.package.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Inspect source package
        id: package
        env:
          RELEASE_EVENT: ${{ github.event_name == 'release' && '1' || '0' }}
        run: python scripts/check_release.py source

  environment:
    name: Initialize PyPI environment (no upload)
    if: >-
      github.repository == 'ultraypy/Omics3D' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    environment:
      name: pypi
    steps:
      - name: Confirm environment
        run: >-
          echo 'The pypi environment is configured. This job does not build or upload a package.'
          >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and verify distributions
    needs: inspect
    if: needs.inspect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: python -m pip install --upgrade build twine packaging
      - name: Build source distribution and wheel
        run: python -m build
      - name: Check PyPI metadata and description
        run: python -m twine check --strict dist/*
      - name: Check package identity and release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
        run: python scripts/check_release.py distributions dist
      - name: Save verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to PyPI
    needs: build
    if: >-
      github.repository == 'ultraypy/Omics3D' &&
      github.event_name == 'release' &&
      github.event.action == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/Omics3D
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Upload with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/

