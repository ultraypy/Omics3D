name: Publish Omics3D 0.0.1.dev0

on:
  push:
    branches: [release/pypi-0.0.1.dev0]

permissions:
  contents: read

concurrency:
  group: omics3d-pypi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Check package readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.package.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: e8b2b7d685b9b09563be2573b7c3dac515a095cd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Inspect source package
        id: package
        env:
          RELEASE_EVENT: '1'
        run: python scripts/check_release.py source

  build:
    name: Build and verify distributions
    needs: inspect
    if: needs.inspect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: e8b2b7d685b9b09563be2573b7c3dac515a095cd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: python -m pip install --upgrade build twine packaging
      - name: Build source distribution and wheel
        run: python -m build
      - name: Check PyPI metadata and description
        run: python -m twine check --strict dist/*
      - name: Check package identity and release version
        env:
          RELEASE_TAG: v0.0.1.dev0
        run: python scripts/check_release.py distributions dist
      - name: Verify installed package
        run: |
          python -m pip install --no-deps dist/*.whl
          python -I -c "from importlib.metadata import version; import omics3d; assert omics3d.__version__ == version('Omics3D')"
          omics3d --version
          python -I -m omics3d
      - name: Save verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create development release
    needs: build
    if: >-
      github.repository == 'ultraypy/Omics3D' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/release/pypi-0.0.1.dev0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release for the verified source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          
          base = 'https://api.github.com/repos/ultraypy/Omics3D/'
          source = 'e8b2b7d685b9b09563be2573b7c3dac515a095cd'
          tag = 'v0.0.1.dev0'
          
          def api(method, path, data=None, allow_missing=False):
              payload = None if data is None else json.dumps(data).encode()
              request = urllib.request.Request(base + path, data=payload, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if allow_missing and error.code == 404:
                      return None
                  raise
          
          head = api('GET', 'git/ref/heads/main')
          assert head['object']['sha'] == source, 'Main changed; review the release source before retrying.'
          ref = api('GET', 'git/ref/tags/' + tag, allow_missing=True)
          if ref is not None:
              assert ref['object']['type'] == 'commit' and ref['object']['sha'] == source, 'Release tag points to different source.'
          release = api('GET', 'releases/tags/' + tag, allow_missing=True)
          if release is None:
              release = api('POST', 'releases', {
                  'tag_name': tag, 'target_commitish': source,
                  'name': 'Omics3D 0.0.1.dev0', 'draft': False, 'prerelease': True,
                  'make_latest': 'false',
                  'body': 'Initial development scaffold for Omics3D.\n\nProvides an installable Python package, version information, and command-line entry points. Reconstruction, analysis, and the web application are not included yet.\n\nValidated by building a wheel from the source distribution, checking metadata, and testing installation and command-line entry points.\n\nInstall this development version with `python -m pip install Omics3D==0.0.1.dev0` after the PyPI publishing job completes.',
              })
          assert not release['draft'] and release['prerelease'], 'Expected a published prerelease.'
          ref = api('GET', 'git/ref/tags/' + tag)
          assert ref['object']['type'] == 'commit' and ref['object']['sha'] == source, 'Published tag source differs.'
          print(release['html_url'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Release: ' + release['html_url'] + '\n')
          PY

  publish:
    name: Publish to PyPI
    needs: [build, release]
    if: >-
      github.repository == 'ultraypy/Omics3D' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/release/pypi-0.0.1.dev0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/Omics3D
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Upload with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
